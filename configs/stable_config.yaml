"""
稳定训练配置示例
用于避免NaN问题的配置
"""

project_name: "MSMT-CSD_INR_Stable"
model_name: "stable_fod_nesh"  # 使用稳定版本模型
output_calculator: "singleshell"
loss_function_name: "stable_singleshell_csd_loss"  # 使用稳定版本损失函数

# 路径配置
paths:
  recon_nifti: "data/processed/your_dwi_data.nii.gz"
  recon_mask: "data/processed/your_mask.nii.gz"
  fsl_bvals: "data/processed/your_bvals.txt"
  fsl_bvecs: "data/processed/your_bvecs.txt"

# 数据配置
width: 64
height: 64
depth: 64
bval_delta: 100

# 训练配置
train_cfg:
  # 学习率配置 - 关键：更小的学习率
  lr: 1e-4  # 从1e-3降低到1e-4
  batch_size: 512
  epochs: 200
  
  # 正则化配置
  lambda: 0.1
  weight_decay: 1e-6  # 添加权重衰减
  
  # 模型配置
  lmax: 8
  lpos: 10
  hidden_dim: 256
  n_layers: 11
  sigma: 5.0  # 降低sigma值
  gaussian: true
  dropout_rate: 0.1  # 添加dropout
  max_freq: 5.0  # 限制最大频率

# 数值稳定性配置
stability:
  # 梯度配置
  max_grad_norm: 1.0
  gradient_clip_type: "norm"  # 或 "value"
  
  # 学习率预热
  warmup_epochs: 5
  warmup_factor: 0.1
  
  # 早期停止
  patience: 15
  min_delta: 1e-6
  
  # 优化器配置
  optimizer: "adamw"  # 使用AdamW而不是Adam
  eps: 1e-8
  betas: [0.9, 0.999]
  
  # 学习率调度
  scheduler: "reduce_on_plateau"
  scheduler_factor: 0.8
  scheduler_patience: 10
  scheduler_min_lr: 1e-7

# 监控配置
log_freq: 50
wandb_project: "stable_training"

# 数据处理配置
data_processing:
  normalize_input: true
  normalize_output: true
  clip_outliers: true
  outlier_threshold: 3.0  # 标准差阈值

# 模型初始化配置
model_init:
  method: "xavier"  # "xavier", "normal", "orthogonal"
  gain: 0.1
  bias_init: "zero"

# 故障恢复配置
recovery:
  enable_auto_recovery: true
  max_consecutive_nan: 3
  recovery_method: "partial_reset"  # "full_reset", "partial_reset", "lr_decay"
  
# FOD相关配置
fod_rescale: true
